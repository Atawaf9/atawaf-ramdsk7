name: Build Full SSH Ramdisk (macOS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Make tools executable
        run: |
          chmod +x ./img4 ./gtar ./trustcache || true

      - name: Download and Extract All Bootchain & Co-Processor Files
        run: |
          set -ex
          IPSW_URL="https://updates.cdn-apple.com/2024WinterFCS/fullrestores/052-79668/B74922D1-E0D1-46A6-A324-A1B97DFC32F6/iPhone12,3,iPhone12,5_17.4.1_21E237_Restore.ipsw"
          
          pip3 install remotezip
          
          python3 -c "
          import remotezip
          import plistlib
          import os
          
          url = '$IPSW_URL'
          with remotezip.RemoteZip(url) as z:
              manifest_data = z.read('BuildManifest.plist')
              with open('BuildManifest.plist', 'wb') as f:
                  f.write(manifest_data)
                  
              plist = plistlib.loads(manifest_data)
              manifest = plist['BuildIdentities'][0]['Manifest']
              
              # قائمة بكافة الملفات المطلوبة للإقلاع الكامل الظاهر في الأداة
              targets = {
                  'RestoreRamDisk': manifest['RestoreRamDisk']['Info']['Path'],
                  'iBSS': manifest['iBSS']['Info']['Path'],
                  'iBEC': manifest['iBEC']['Info']['Path'] if 'iBEC' in manifest else manifest['iBSS']['Info']['Path'].replace('iBSS', 'iBEC'),
                  'DeviceTree': manifest['DeviceTree']['Info']['Path'],
                  'KernelCache': manifest['KernelCache']['Info']['Path'],
                  'AOP': manifest['AOP']['Info']['Path'] if 'AOP' in manifest else None,
                  'ANE': manifest['ANE']['Info']['Path'] if 'ANE' in manifest else None,
                  'AVE': manifest['AVE']['Info']['Path'] if 'AVE' in manifest else None,
                  'ISP': manifest['ISP']['Info']['Path'] if 'ISP' in manifest else None,
                  'GFX': manifest['GFX']['Info']['Path'] if 'GFX' in manifest else None,
                  'SIO': manifest['SIO']['Info']['Path'] if 'SIO' in manifest else None,
                  'PMP': manifest['PMP']['Info']['Path'] if 'PMP' in manifest else None,
                  'WHC': manifest['WHC']['Info']['Path'] if 'WHC' in manifest else None,
                  'SEP': manifest['SEP']['Info']['Path'] if 'SEP' in manifest else None
              }
              
              # إنشاء مستند نصي بالمسارات وحفظ وتحميل كل ملف متاح
              with open('paths.txt', 'w') as p:
                  for name, path in targets.items():
                      if path:
                          p.write(f'{name}_PATH={path}\n')
                          print(f'Extracting {name}: {path}')
                          z.extract(path, '.')
          "

      - name: Organize All Extracted Files
        run: |
          set -ex
          export $(cat paths.txt | xargs)
          
          # إعداد مجلد المخرجات النهائي
          mkdir -p bootchain_outputs
          
          # نقل وتصنيف الملفات المستخرجة وإعادة تسميتها تلقائياً لحروف صغيرة متوافقة مع الأداة
          cp "$RAMDISK_PATH" original_ramdisk.dmg || cp $(basename "$RAMDISK_PATH") original_ramdisk.dmg || true
          cp "$IBSS_PATH" bootchain_outputs/ibss.im4p || cp $(basename "$IBSS_PATH") bootchain_outputs/ibss.im4p || true
          cp "$IBEC_PATH" bootchain_outputs/ibec.im4p || cp $(basename "$IBEC_PATH") bootchain_outputs/ibec.im4p || true
          cp "$DVT_PATH" bootchain_outputs/devicetree.img4 || cp $(basename "$DVT_PATH") bootchain_outputs/devicetree.img4 || true
          cp "$KERN_PATH" bootchain_outputs/kernelcache.img4 || cp $(basename "$KERN_PATH") bootchain_outputs/kernelcache.img4 || true
          
          # نقل ملفات المعالجات المساعدة والدقيقة الفرعية (Co-Processors)
          mkdir -p bootchain_outputs/firmware
          find . -name "*.im4p" -maxdepth 4 -exec cp {} bootchain_outputs/firmware/ \; 2>/dev/null || true
          find . -name "*.img4" -maxdepth 4 -exec cp {} bootchain_outputs/firmware/ \; 2>/dev/null || true

      - name: Mount original and create new ramdisk
        run: |
          set -ex
          if [ -f original_ramdisk.dmg ]; then
            mkdir -p SSHRD
            sudo hdiutil attach -mountpoint SSHRD -owners off original_ramdisk.dmg
            sudo hdiutil create \
              -size 210m \
              -imagekey diskimage-class=CRamDiskImage \
              -format UDIF \
              -fs HFS+ \
              -layout NONE \
              -srcfolder SSHRD \
              -copyuid root \
              ramdisk1.dmg
            sudo hdiutil detach -force SSHRD
          fi

      - name: Mount new ramdisk and add SSH + mount_filesystems
        run: |
          set -ex
          if [ -f ramdisk1.dmg ]; then
            mkdir -p SSHRD
            sudo hdiutil attach -mountpoint SSHRD -owners off ramdisk1.dmg
            ./gtar -x --no-overwrite-dir -f ssh.tar.gz -C SSHRD || true
            cp mount_filesystems.safe SSHRD/usr/sbin/mount_filesystems || true
            chmod 755 SSHRD/usr/sbin/mount_filesystems || true
            sudo hdiutil detach -force SSHRD
          fi

      - name: Resize and Sign Final Ramdisk
        run: |
          set -ex
          if [ -f ramdisk1.dmg ]; then
            sudo hdiutil resize -sectors min ramdisk1.dmg || true
            ./img4 -i ramdisk1.dmg -o bootchain_outputs/ramdisk.img4 -A -T rdisk -M IM4M_0x8020 || true
          fi

      - name: Build trustcache and finalize package
        run: |
          set -ex
          if [ -f 094-32271-023.dmg.trustcache ]; then
            ./img4 -i 094-32271-023.dmg.trustcache -o trustcache.bin || true
            mkdir -p work/sshtar
            ./gtar -x --no-overwrite-dir -f ssh.tar.gz -C work/sshtar || true
            cp mount_filesystems.safe work/sshtar/usr/sbin/mount_filesystems || true
            ./trustcache append trustcache.bin $(cat sshtarlist.txt) || true
            ./img4 -t rtsc -i trustcache.bin -o bootchain_outputs/trustcache.img4 -A -T rtsc -M IM4M_0x8020 || true
          fi
          
          # استعراض المجلد للتأكد من وجود كافة الحزم المستخرجة
          cd bootchain_outputs
          ls -la
          ls -la firmware/ || true

      - name: Upload Complete Pack (All Bootchain Files)
        uses: actions/upload-artifact@v4
        with:
          name: Full-EFT-Bootchain-Package
          path: bootchain_outputs/
