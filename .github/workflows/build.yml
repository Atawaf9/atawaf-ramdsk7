name: Build Full SSH Ramdisk (macOS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Make tools executable
        run: |
          # إضافة النقطة والسلاش لضمان العثور على الأدوات محلياً داخل المجلد
          chmod +x ./pzp ./img4 ./gtar ./trustcache

      - name: Download BuildManifest and Extract All Paths
        run: |
          set -ex
          IPSW_URL="https://updates.cdn-apple.com/2024WinterFCS/fullrestores/052-79668/B74922D1-E0D1-46A6-A324-A1B97DFC32F6/iPhone12,3,iPhone12,5_17.4.1_21E237_Restore.ipsw"
          
          # تشغيل أداة pzp بالمسار الصحيح
          ./pzp -g BuildManifest.plist "$IPSW_URL"
          
          # استخراج المسارات بدقة عبر بايثون
          python3 -c '
          import plistlib
          with open("BuildManifest.plist", "rb") as f:
              plist = plistlib.load(f)
          
          manifest = plist["BuildIdentities"][0]["Manifest"]
          
          print(f"RAMDISK_PATH={manifest[\"RestoreRamDisk\"][\"Info\"][\"Path\"]}")
          print(f"IBSS_PATH={manifest[\"iBSS\"][\"Info\"][\"Path\"]}")
          print(f"IBEC_PATH={manifest[\"iBEC\"][\"Info\"][\"Path\"]}")
          print(f"DVT_PATH={manifest[\"DeviceTree\"][\"Info\"][\"Path\"]}")
          print(f"KERN_PATH={manifest[\"KernelCache\"][\"Info\"][\"Path\"]}")
          ' > paths.txt

          cat paths.txt

      - name: Download and decrypt ramdisk & bootchain files
        run: |
          set -ex
          IPSW_URL="https://cdn-apple.com"
          
          export $(cat paths.txt | xargs)
          
          # استخدام الأدوات بالمسار المحلي الصحيح
          ./pzp -g "$RAMDISK_PATH" "$IPSW_URL"
          RAMDISK_FILE=$(basename "$RAMDISK_PATH")
          mv "$RAMDISK_FILE" original_ramdisk.dmg

          ./pzp -g "$IBSS_PATH" "$IPSW_URL"
          ./pzp -g "$IBEC_PATH" "$IPSW_URL"
          ./pzp -g "$DVT_PATH" "$IPSW_URL"
          ./pzp -g "$KERN_PATH" "$IPSW_URL"

      - name: Mount original and create new ramdisk
        run: |
          set -ex
          mkdir -p SSHRD
          sudo hdiutil attach -mountpoint SSHRD -owners off original_ramdisk.dmg
          sudo hdiutil create \
            -size 210m \
            -imagekey diskimage-class=CRamDiskImage \
            -format UDIF \
            -fs HFS+ \
            -layout NONE \
            -srcfolder SSHRD \
            -copyuid root \
            ramdisk1.dmg
          sudo hdiutil detach -force SSHRD

      - name: Mount new ramdisk and add SSH + mount_filesystems
        run: |
          set -ex
          mkdir -p SSHRD
          sudo hdiutil attach -mountpoint SSHRD -owners off ramdisk1.dmg
          ./gtar -x --no-overwrite-dir -f ssh.tar.gz -C SSHRD
          cp mount_filesystems.safe SSHRD/usr/sbin/mount_filesystems
          chmod 755 SSHRD/usr/sbin/mount_filesystems
          sudo hdiutil detach -force SSHRD

      - name: Resize image
        run: |
          set -ex
          sudo hdiutil resize -sectors min ramdisk1.dmg

      - name: Build trustcache and prepare outputs
        run: |
          set -ex
          mkdir -p bootchain_outputs
          
          # نقل وتجميع كافة الملفات المستخرجة
          mv *.im4p *.img4 kernelcache* bootchain_outputs/ 2>/dev/null || true
          
          ./img4 -i 094-32271-023.dmg.trustcache -o trustcache.bin
          mkdir -p work/sshtar
          ./gtar -x --no-overwrite-dir -f ssh.tar.gz -C work/sshtar
          cp mount_filesystems.safe work/sshtar/usr/sbin/mount_filesystems
          ./trustcache append trustcache.bin $(cat sshtarlist.txt)
          ./img4 -t rtsc -i trustcache.bin -o bootchain_outputs/trustcache.img4 -A -T rtsc -M IM4M_0x8020

      - name: Sign ramdisk and finalize package
        run: |
          set -ex
          ./img4 -i ramdisk1.dmg -o bootchain_outputs/ramdisk.img4 -A -T rdisk -M IM4M_0x8020
          
          cd bootchain_outputs
          ls -la

      - name: Upload Complete Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ramdisk-files
          path: bootchain_outputs/
