name: Build Full SSH Ramdisk (macOS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Make tools executable
        run: |
          chmod +x ./img4 ./gtar ./trustcache || true

      - name: Download BuildManifest and Extract All Paths via Python
        run: |
          set -ex
          IPSW_URL="https://updates.cdn-apple.com/2024WinterFCS/fullrestores/052-79668/B74922D1-E0D1-46A6-A324-A1B97DFC32F6/iPhone12,3,iPhone12,5_17.4.1_21E237_Restore.ipsw"
          
          # تثبيت مكتبة التعامل مع ملفات IPSW البعيدة لضمان استقرار التحميل 100%
          pip3 install remotezip
          
          python3 -c "
          import remotezip
          import plistlib
          
          url = '$IPSW_URL'
          with remotezip.RemoteZip(url) as z:
              # تحميل ملف البيلد مانيفست مباشرة بدون أدوات معقدة
              manifest_data = z.read('BuildManifest.plist')
              with open('BuildManifest.plist', 'wb') as f:
                  f.write(manifest_data)
                  
              plist = plistlib.loads(manifest_data)
              manifest = plist['BuildIdentities'][0]['Manifest']
              
              # استخراج المسارات
              ramdisk = manifest['RestoreRamDisk']['Info']['Path']
              ibss = manifest['iBSS']['Info']['Path']
              ibec = manifest['iBEC']['Info']['Path'] if 'iBEC' in manifest else manifest['iBSS']['Info']['Path'].replace('iBSS', 'iBEC')
              dvt = manifest['DeviceTree']['Info']['Path']
              kern = manifest['KernelCache']['Info']['Path']
              
              # حفظ المسارات في مستند
              with open('paths.txt', 'w') as p:
                  p.write(f'RAMDISK_PATH={ramdisk}\n')
                  p.write(f'IBSS_PATH={ibss}\n')
                  p.write(f'IBEC_PATH={ibec}\n')
                  p.write(f'DVT_PATH={dvt}\n')
                  p.write(f'KERN_PATH={kern}\n')
                  
              # تحميل الملفات الكاملة فوراً وبشكل مستقر جداً
              print(f'Downloading: {ramdisk}')
              z.extract(ramdisk, '.')
              print(f'Downloading: {ibss}')
              z.extract(ibss, '.')
              print(f'Downloading: {ibec}')
              z.extract(ibec, '.')
              print(f'Downloading: {dvt}')
              z.extract(dvt, '.')
              print(f'Downloading: {kern}')
              z.extract(kern, '.')
          "
          
          cat paths.txt

      - name: Organize Downloaded Files
        run: |
          set -ex
          export $(cat paths.txt | xargs)
          
          # نقل وضبط الملفات المستخرجة
          RAMDISK_FILE=$(basename "$RAMDISK_PATH")
          mv "$RAMDISK_PATH" original_ramdisk.dmg || mv "$RAMDISK_FILE" original_ramdisk.dmg || true
          
          # نقل ملفات البوت تشين للمجلد الرئيسي لتتعامل معها الأدوات اللاحقة
          mv "$IBSS_PATH" $(basename "$IBSS_PATH") || true
          mv "$IBEC_PATH" $(basename "$IBEC_PATH") || true
          mv "$DVT_PATH" $(basename "$DVT_PATH") || true
          mv "$KERN_PATH" $(basename "$KERN_PATH") || true

      - name: Mount original and create new ramdisk
        run: |
          set -ex
          mkdir -p SSHRD
          sudo hdiutil attach -mountpoint SSHRD -owners off original_ramdisk.dmg
          sudo hdiutil create \
            -size 210m \
            -imagekey diskimage-class=CRamDiskImage \
            -format UDIF \
            -fs HFS+ \
            -layout NONE \
            -srcfolder SSHRD \
            -copyuid root \
            ramdisk1.dmg
          sudo hdiutil detach -force SSHRD

      - name: Mount new ramdisk and add SSH + mount_filesystems
        run: |
          set -ex
          mkdir -p SSHRD
          sudo hdiutil attach -mountpoint SSHRD -owners off ramdisk1.dmg
          ./gtar -x --no-overwrite-dir -f ssh.tar.gz -C SSHRD
          cp mount_filesystems.safe SSHRD/usr/sbin/mount_filesystems
          chmod 755 SSHRD/usr/sbin/mount_filesystems
          sudo hdiutil detach -force SSHRD

      - name: Resize image
        run: |
          set -ex
          sudo hdiutil resize -sectors min ramdisk1.dmg

      - name: Build trustcache and prepare outputs
        run: |
          set -ex
          mkdir -p bootchain_outputs
          
          # تجميع كافة ملفات الـ Bootchain المستخرجة وتسميتها بحروف صغيرة لتطابق الهاتف
          mv *iBSS* bootchain_outputs/ibss.im4p 2>/dev/null || mv *iBSS* bootchain_outputs/ibss.img4 2>/dev/null || true
          mv *iBEC* bootchain_outputs/ibec.im4p 2>/dev/null || mv *iBEC* bootchain_outputs/ibec.img4 2>/dev/null || true
          mv *DeviceTree* bootchain_outputs/devicetree.img4 2>/dev/null || true
          mv *kernelcache* bootchain_outputs/kernelcache.img4 2>/dev/null || true
          
          ./img4 -i 094-32271-023.dmg.trustcache -o trustcache.bin
          mkdir -p work/sshtar
          ./gtar -x --no-overwrite-dir -f ssh.tar.gz -C work/sshtar
          cp mount_filesystems.safe work/sshtar/usr/sbin/mount_filesystems
          ./trustcache append trustcache.bin $(cat sshtarlist.txt)
          ./img4 -t rtsc -i trustcache.bin -o bootchain_outputs/trustcache.img4 -A -T rtsc -M IM4M_0x8020

      - name: Sign ramdisk and finalize package
        run: |
          set -ex
          ./img4 -i ramdisk1.dmg -o bootchain_outputs/ramdisk.img4 -A -T rdisk -M IM4M_0x8020
          
          cd bootchain_outputs
          ls -la

      - name: Upload Complete Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ramdisk-files
          path: bootchain_outputs/
